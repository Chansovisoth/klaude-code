[project]
name = "klaude-web"
version = "0.2.0a1"
description = "klaude-code web layer: SearXNG search + fetch cascade"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "trafilatura>=1.9", "klaude-core"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
klaude-web-mcp = "klaude_web.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_web"]
