[project]
name = "klaude-tools"
version = "0.2.0a2"
description = "klaude-code built-in tools: fs, shell, git, edit"
requires-python = ">=3.11"
dependencies = ["klaude-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_tools"]
