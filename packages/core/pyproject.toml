[project]
name = "klaude-core"
version = "0.2.0a4"
description = "klaude-code agent engine: loop, router, permissions, memory"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "httpx2>=2.0", "rapidfuzz>=3.9", "rich>=13.7", "mcp>=2.2,<3"]

[project.optional-dependencies]
cloud = ["openai>=1.0", "google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_core"]
