[project]
name = "klaude-core"
version = "0.2.0a2"
description = "klaude-code agent engine: loop, router, permissions, memory"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_core"]
