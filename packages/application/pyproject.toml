[project]
name = "klaude-application"
version = "0.2.0a4"
description = "Shared application bridge for Klaude clients"
requires-python = ">=3.11"
dependencies = [
    "klaude-core",
    "klaude-knowledge",
    "klaude-tools",
    "klaude-web",
    "pypdf>=6.21.1,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_application"]
