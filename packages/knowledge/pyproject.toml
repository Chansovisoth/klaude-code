[project]
name = "klaude-knowledge"
version = "0.2.0a1"
description = "klaude-code knowledge layer: LanceDB + FTS5 hybrid RAG"
requires-python = ">=3.11"
dependencies = ["lancedb>=0.13", "httpx>=0.27", "klaude-core"]

[project.optional-dependencies]
rerank = ["flashrank>=0.2"]
mcp = ["mcp>=1.0"]

[project.scripts]
klaude-knowledge-mcp = "klaude_knowledge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_knowledge"]
