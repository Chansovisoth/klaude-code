[project]
name = "klaude-code-workspace"
version = "0.2.0a3"
description = "klaude-code: a local-first AI coding agent (Ollama + RAG + web search)"
requires-python = ">=3.11"
dependencies = [
    "klaude-cli",
]

[project.optional-dependencies]
cloud = ["klaude-core[cloud]"]

[tool.uv.workspace]
members = ["apps/cli", "packages/*"]

[tool.uv.sources]
klaude-cli = { workspace = true }
klaude-core = { workspace = true }
klaude-knowledge = { workspace = true }
klaude-web = { workspace = true }
klaude-tools = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyte>=0.8.2",
    "pytest>=9.1.1",
    "ruff>=0.14.9",
]
