[project]
name = "klaude-cli"
version = "0.1.0"
description = "klaude: local-first AI coding agent CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "klaude-core",
    "klaude-knowledge",
    "klaude-web",
    "klaude-tools",
]

[project.scripts]
klaude = "klaude_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_cli"]
