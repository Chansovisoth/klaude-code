[project]
name = "klaude-webhost"
version = "0.2.0a4"
description = "Local browser host for Klaude's shared application"
requires-python = ">=3.11"
dependencies = ["klaude-application", "klaude-core", "klaude-tools"]

[project.scripts]
klaude-webui = "klaude_webhost.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaude_webhost"]
