# Portable source-checkout defaults.
#
# When this repo is run from source, Klaude already uses:
# - config/config.toml
# - config/.env
# - config/online-docs.txt
# - .klaude/data/
#
# Copy this file to config/config.toml only if you want an explicit
# local config file with the default layout.

[models]
# tier = "full"

[web]
provider = "quality"

[web.search]
provider_order = ["brave", "ddgs", "searxng", "brave_api", "google", "parallel", "exa", "tavily", "firecrawl"]

[permissions]
# run_shell     = "ask"
# delegate_task = "ask"      # bounded read-only child; permissions never escalate
# edit_file     = "ask"
