# Copy to config/config.toml and edit. Everything has defaults;
# an empty file (or no file) works out of the box.

[models]
# tier = "full"        # lite | standard | full (auto-detected from RAM if unset)
# [models.override]
# coder = "qwen3-coder:30b"

[ollama]
# General reasoning control. Keep false for responsive small-model chat/tool
# use; choose low/medium/high on capable hardware and models when desired.
# think = false
# Optional code-only override. This never silently changes the selected model.
# code_think = "low"

[ollama.options]
# Sent with each /api/chat request. On an 8-thread CPU, num_thread = 6 is
# about 75% of logical threads and num_thread = 8 asks Ollama to use all
# logical threads. Ollama's own guidance often favors physical cores for best
# throughput, so benchmark 4/6/8 if you are tuning carefully. Leave num_gpu
# unset for Ollama's automatic CUDA/GPU placement; set num_gpu = 0 only if you
# need CPU-only debugging.
# num_ctx = 8192
# num_thread = 8
# num_gpu = 999
# num_predict = 2048  # default output-token ceiling; raise for deliberately long code
# temperature = 0.2
# top_p = 0.9
# min_p = 0.0
# presence_penalty = 0.0
# frequency_penalty = 0.0
# repeat_penalty = 1.1

# Optional overrides used only for code requests. Constrained machines can set
# smaller context/output ceilings; stronger machines can raise them without
# increasing the cost of ordinary chat and retrieval turns.
[ollama.code_options]
# num_ctx = 16384
# num_predict = 4096
# temperature = 0.15
# top_p = 0.85
# presence_penalty = 0.0

[agent]
# Maximum model/tool-loop iterations for one user turn. Keep this bounded on
# slower hardware; raise it only for workflows that genuinely need more tools.
# max_steps = 8
# retrieval_k = 6
# Continue a response only when Ollama reports an output-length stop inside an
# unfinished fenced code block.  Limited to avoid loops with weak local models.
# max_code_continuations = 2
# Repair mechanically invalid Python/GDScript from concrete diagnostics only.
# max_code_repairs = 2

[services]
# ollama_url  = "http://localhost:11434"
# searxng_url = "http://localhost:8888"
# crawl4ai_url = "http://localhost:11235"   # uncomment if running the heavy profile
# Prefer CRAWL4AI_API_KEY in config/.env when your Crawl4AI server requires auth.

[web]
# quality = relevance-first provider routing; SearXNG is last-resort fallback
# local   = explicit SearXNG/local fetch compatibility mode
# exa     = explicit Exa compatibility mode; requires EXA_API_KEY in config/.env
# auto    = quality routing with compatibility naming
# provider = "quality"

[web.billing]
# strict_zero_cost | prepaid_free_search_allowance | manual_paid_opt_in
# mode = "prepaid_free_search_allowance"
# allow_paid_overage = false
# allow_auto_recharge = false

[web.search]
# strategy = "quality"
# stop_when_sufficient = true
# Return all safe SERP leads by default. Enable only for strict entity lookups.
# strict_result_filtering = false
# skip_unconfigured_providers = true
# fallback_on_quota = true
# fallback_on_unavailable = true
# fallback_on_low_relevance = true
# return_unrelated_results = false
# max_provider_attempts = 3
# max_results_per_domain = 2
# candidate_discovery_threshold = 0.38
# final_verification_threshold = 0.72
# minimum_relevance = 0.62
# strict_entity_relevance = 0.78
# minimum_authority = 0.45
# max_attempts_per_provider = 2
# base_retry_delay_ms = 500
# maximum_retry_delay_seconds = 10
# honor_retry_after = true
# cache_enabled = true
# max_disambiguation_queries = 4
# minimum_confident_entity_score = 0.68
# minimum_winner_margin = 0.18

[web.search.relevance]
# candidate_discovery_threshold = 0.38
# final_verification_threshold = 0.72
# strict_entity_threshold = 0.78

[web.search.location]
# enabled = true
# use_runtime_country = true
# send_country_for_local_intent_only = true
# maximum_inferred_location_weight = 0.10

[web.search.behavior]
# max_query_rewrites = 3
# max_provider_fallbacks = 4
# Ordinary single-agent browsing budgets. Search and fetch also share the
# max_web_actions ceiling, so the model should stop as soon as evidence is enough.
# max_web_actions = 6
# max_search_calls = 3
# max_fetch_calls = 4
# max_pages_per_domain = 2
# max_consecutive_failures = 3
# Legacy aliases remain accepted for existing installations:
# max_total_search_calls = 6
# max_fetch_attempts = 4
# max_repeated_query_similarity = 0.90

[web.fetch]
# Bounds for the untrusted public-page fetch tool. Redirect targets are
# revalidated and only public HTTP(S) URLs are allowed.
# timeout_seconds = 30
# max_download_bytes = 2000000
# max_content_characters = 20000
# max_redirects = 5
# cache_ttl_seconds = 86400

[web.verification]
# max_domains = 2
# max_pages_per_domain = 4
# max_total_verification_pages = 6
# same_domain_only = true
# respect_robots = true

[web.providers.google]
# enabled = true
# api_key_env = "GEMINI_API_KEY"

[web.providers.parallel]
# enabled = true
# api_key_env = "PARALLEL_API_KEY"

[web.providers.tavily]
# enabled = true
# api_key_env = "TAVILY_API_KEY"
# Search only. Extract/Crawl/Map/Research are not exposed as Klaude tools.
# Keep "basic" for conservative credit use; "advanced" may cost more credits.
# default_depth = "basic"

[web.providers.exa]
# enabled = true
# api_key_env = "EXA_API_KEY"

[web.providers.firecrawl]
# enabled = true
# api_key_env = "FIRECRAWL_API_KEY"
# Search only. Scrape/Crawl/Map/Monitor/Research are not exposed as Klaude tools.
# Native Firecrawl search uses the v2 API and caps ordinary provider attempts.

[web.providers.ddgs]
# enabled = true

[web.providers.searxng]
# enabled = true
# last_resort_only = true
# automatic_merge = false

[huggingface]
# Public Hub lookup works without a key. Prefer HUGGINGFACE_API_KEY in config/.env for
# authenticated access instead of storing secrets in this file.
# base_url = "https://huggingface.co"

[knowledge]
# Keep this many previous current/ trees for docs-sources and skills.
# snapshot_retention = 3

[crawler]
# Same-domain only by design. Defaults are polite enough for documentation
# refreshes without turning Klaude into an aggressive scraper.
# user_agent = "KlaudeBot/0.2 (+local documentation crawler)"
# max_depth = 2
# max_pages = 50
# delay_min = 2.0
# delay_max = 5.0
# respect_robots = true

# Entity names and typo correction are local-first. Wikimedia is an optional,
# keyless fallback for unresolved probable names; only the minimal name phrase is sent.
[entities]
metadata_refresh_days = 90

[entities.wikimedia]
enabled = false
timeout_seconds = 3
max_results = 5

[runtime_context]
# Collected at model startup and refreshed before each model run. Fastfetch is
# preferred because it provides structured JSON; Neofetch and native local
# detection are fallback-only. No network geolocation is used by default.
# enabled = true
# provider = "auto"              # auto | fastfetch | neofetch | native | off
# refresh_seconds = 300
# command_timeout_seconds = 3
# max_prompt_characters = 3500
# include_workspace = true
# include_git = true
# include_displays = true
# include_disks = true
# include_local_ip = true
# show_install_suggestion = true

[runtime_context.location]
# mode = "local"                 # configured | local | network | off
# configured_country = ""
# configured_region = ""
# allow_network_lookup = false   # network mode remains opt-in

[permissions]
# run_shell = "ask"    # ask | allow | deny
# edit_file = "ask"
# crawl_site = "ask"
