services:
  searxng:
    image: searxng/searxng:latest
    container_name: klaude-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    env_file:
      - ./config/searxng.env
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

  # Optional: JS-rendering scrape tier. klaude works without it
  # (falls back to raw HTTP + trafilatura extraction).
  # Start with: docker compose --profile heavy up -d
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: klaude-crawl4ai
    profiles: ["heavy"]
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: "1g"
    restart: unless-stopped

  # Optional: fully self-contained Ollama (installer option 3).
  # CPU-only unless the NVIDIA container toolkit is installed — for GPU,
  # uncomment the deploy block below. Models live in the named volume,
  # separate from any system-wide Ollama's model store.
  ollama:
    image: ollama/ollama:latest
    container_name: klaude-ollama
    profiles: ["selfhosted"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
